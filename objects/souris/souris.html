<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souris en AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!--A-Frame est un framework open-source basé sur le web (HTML) pour créer des
   expériences de réalité virtuelle (VR) et de réalité augmentée (AR).-->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { 
      margin: 0; 
      height: 100%; 
      overflow: hidden; 
    }
    #notice {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 10;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font: 15px/1.4 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #notice strong { color: #ffd54a; }
    #notice.hidden { opacity: 0; }
  </style>
</head>

<body>
  <div id="notice">
    <strong>Important :</strong> le logo de l'école doit apparaître en entier
    à l'écran, bien éclairé et sans reflet, pour que la réalité augmentée s'affiche.
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ../../shared/logo.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <!--initialise automatiquement le renderer, la caméra, les lumières et le support WebXR.  
    C'est le point d'entrée unique.-->

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Repère MindAR : x = droite, y = haut de la feuille, z = hauteur au-dessus de la feuille.
           Unité : 0.0885 x largeur imprimée de l'image cible. -->
      <!--out objet 3D (cube, sphère, modèle glTF, texte, son…) est une entité, à laquelle on
          attache des composants (géométrie, matériau, animation, comportement AR, etc.).-->
      <a-entity scale="0.0885 0.0885 0.0885">

        <!-- Clic droit -->
        <a-entity line="start: 14.37 2.93 3.5; end: 19.3 6 7; color: #4aa3ff"></a-entity>
        <a-text value="Clic droit" position="19.5 6 7" anchor="left" width="20" color="#4aa3ff"></a-text>

        <!-- Molette -->
        <a-entity line="start: 12.91 3.07 3.8; end: 19.3 3 8.5; color: yellow"></a-entity>
        <a-text value="Molette" position="19.5 3 8.5" anchor="left" width="20" color="yellow"></a-text>

        <!-- Bouton DPI -->
        <a-entity line="start: 12.96 1.5 3.6; end: 19.3 0 7; color: #7fdc6a"></a-entity>
        <a-text value="Bouton DPI" position="19.5 0 7" anchor="left" width="20" color="#7fdc6a"></a-text>

        <!-- Clic gauche -->
        <a-entity line="start: 11.36 2.93 3.5; end: 9.2 4.5 0.5; color: red"></a-entity>
        <a-text value="Clic gauche" position="9 4.5 0.5" anchor="right" width="16" color="red"></a-text>

        <!-- Bouton avant -->
        <a-entity line="start: 10.03 1.81 2.2; end: 9.2 2.5 0.5; color: #c060e0"></a-entity>
        <a-text value="Bouton avant" position="9 2.5 0.5" anchor="right" width="16" color="#c060e0"></a-text>

        <!-- Bouton retour -->
        <a-entity line="start: 9.67 0.31 2.2; end: 9.2 0.5 0.5; color: orange"></a-entity>
        <a-text value="Bouton retour" position="9 0.5 0.5" anchor="right" width="16" color="orange"></a-text>

      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // La notice disparaît dès que le logo est reconnu, et revient s'il est perdu.
    const notice = document.getElementById('notice');
    const target = document.querySelector('[mindar-image-target]');
    target.addEventListener('targetFound', () => notice.classList.add('hidden'));
    target.addEventListener('targetLost', () => notice.classList.remove('hidden'));
  </script>
</body>
</html>
