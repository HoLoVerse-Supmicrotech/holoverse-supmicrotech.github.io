<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Souris en AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
  </style>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ../../shared/logo.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Repère MindAR : x = droite, y = haut de la feuille, z = hauteur au-dessus de la feuille.
           Unité : 0.0885 x largeur imprimée de l'image cible. -->
      <a-entity scale="0.0885 0.0885 0.0885">

        <!-- Clic droit -->
        <a-entity line="start: 14.37 2.93 3.5; end: 19.3 6 7; color: #4aa3ff"></a-entity>
        <a-text value="Clic droit" position="19.5 6 7" anchor="left" width="20" color="#4aa3ff"></a-text>

        <!-- Molette -->
        <a-entity line="start: 12.91 3.07 3.8; end: 19.3 3 8.5; color: yellow"></a-entity>
        <a-text value="Molette" position="19.5 3 8.5" anchor="left" width="20" color="yellow"></a-text>

        <!-- Bouton DPI -->
        <a-entity line="start: 12.96 1.5 3.6; end: 19.3 0 7; color: #7fdc6a"></a-entity>
        <a-text value="Bouton DPI" position="19.5 0 7" anchor="left" width="20" color="#7fdc6a"></a-text>

        <!-- Clic gauche -->
        <a-entity line="start: 11.36 2.93 3.5; end: 9.2 4.5 0.5; color: red"></a-entity>
        <a-text value="Clic gauche" position="9 4.5 0.5" anchor="right" width="16" color="red"></a-text>

        <!-- Bouton avant -->
        <a-entity line="start: 10.03 1.81 2.2; end: 9.2 2.5 0.5; color: #c060e0"></a-entity>
        <a-text value="Bouton avant" position="9 2.5 0.5" anchor="right" width="16" color="#c060e0"></a-text>

        <!-- Bouton retour -->
        <a-entity line="start: 9.67 0.31 2.2; end: 9.2 0.5 0.5; color: orange"></a-entity>
        <a-text value="Bouton retour" position="9 0.5 0.5" anchor="right" width="16" color="orange"></a-text>

      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
